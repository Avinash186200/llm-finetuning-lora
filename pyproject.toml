[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorafin"
version = "1.0.0"
description = "LoRA fine-tuning vs prompting on a small structured-extraction task, measured honestly on CPU."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.45", "peft>=0.12", "accelerate>=0.30"]
gpu = ["bitsandbytes>=0.43"]
dev = ["pytest>=8"]

[project.scripts]
make_data = "lorafin.cli:make_data_main"
train = "lorafin.cli:train_main"
evaluate = "lorafin.cli:evaluate_main"
compare = "lorafin.cli:compare_main"
export = "lorafin.cli:export_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
